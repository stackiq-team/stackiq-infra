apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: stackiq
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@stackiq
        name: Flux
      messageTemplate: "chore: update images"
    push:
      branch: main
  update:
    path: ./apps
    strategy: Setters